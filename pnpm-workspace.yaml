packages:
  - 'packages/*'
  - 'apps/*'
  # one example project per converter, driven by examples/converters/harness
  - 'examples/converters/*'
allowBuilds:
  # jest's watcher; `jest run` in the examples does not need the native binding
  '@parcel/watcher': false
  better-sqlite3: true
  # resemblejs's Node fallback; the site runs it in the browser only
  canvas: false
  # the Cypress binary is fetched by the e2e-cypress CI job behind a cache keyed by version
  cypress: false
  esbuild: true
  # lost-pixel's optional odiff engine; the examples compare with pixelmatch, the default
  odiff-bin: false
  # BackstopJS's engine; the e2e-backstopjs CI job fetches Chrome behind a cache keyed by version
  puppeteer: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
  # wrangler's runtime; only `wrangler deploy` of static assets is used
  workerd: false
overrides:
  '@rollup/pluginutils@4.2.1>picomatch': '4.0.7'
  # eslint rejects one config that holds two copies of the plugin; keep a single version (match package.json)
  '@typescript-eslint/eslint-plugin': '8.72.2'
  '@typescript-eslint/parser': '8.72.2'
  '@typescript-eslint/utils': '8.72.2'
  typescript-eslint: '8.72.2'
patchedDependencies:
  rollup-plugin-typescript2@0.32.1: patches/rollup-plugin-typescript2@0.32.1.patch
