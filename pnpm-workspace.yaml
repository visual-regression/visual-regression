packages:
  - 'packages/*'
  - 'apps/*'
  # one example project per converter, driven by examples/converters/harness
  - 'examples/converters/*'
allowBuilds:
  # jest's watcher; `jest run` in the examples does not need the native binding
  '@parcel/watcher': false
  better-sqlite3: true
  # the Cypress binary is fetched by the e2e-cypress CI job behind a cache keyed by version
  cypress: false
  # BackstopJS's engine; the e2e-backstopjs CI job fetches Chrome behind a cache keyed by version
  puppeteer: false
  esbuild: true
  sharp: true
  unrs-resolver: false
  vue-demi: false
  # wrangler's runtime; only `wrangler deploy` of static assets is used
  workerd: false
overrides:
  '@rollup/pluginutils@4.2.1>picomatch': '4.0.7'
patchedDependencies:
  rollup-plugin-typescript2@0.32.1: patches/rollup-plugin-typescript2@0.32.1.patch
