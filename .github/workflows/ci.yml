name: CI
# Always triggered, because the required status checks (lint, test-integration-coverage) must
# report on every PR: a workflow skipped by `paths-ignore` leaves them pending and blocks the merge.
# The `changes` job decides instead, and a job skipped by `if` counts as passing.
# The site has its own workflow (site.yml) with the opposite path filter.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  # The package jobs never need the site or its Nuxt toolchain, nor the converter
  # examples and the tools they pin (billed minutes, browser downloads).
  PACKAGES_INSTALL_FILTER: --filter '!./apps/**' --filter '!./examples/**'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      e2e-jest-image-snapshot: ${{ steps.e2e.outputs.jest-image-snapshot }}
      e2e-playwright: ${{ steps.e2e.outputs.playwright }}
    steps:
      # On push the filter diffs commits locally; on pull_request it uses the API.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            packages:
              - '**'
              - '!apps/**'
              - '!.github/workflows/site.yml'
      # One output per converter example (examples/converters/<tool>): its job runs the
      # real tool, so only changes to the sources of the two packages it exercises
      # (the manifest package converts, the viewer renders), its example, the harness
      # or this workflow trigger it. The lockfile is left out on purpose: a
      # lockfile-only bump would run every tool.
      - uses: dorny/paths-filter@v3
        id: e2e
        with:
          filters: |
            harness: &harness
              - 'examples/converters/harness/**'
              - 'packages/visual-regression-manifest/src/**'
              - '!packages/visual-regression-manifest/src/**/*.test.ts'
              - 'packages/visual-regression-viewer/src/**'
              - '!packages/visual-regression-viewer/src/**/*.test.ts'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            jest-image-snapshot:
              - *harness
              - 'examples/converters/jest-image-snapshot/**'
            playwright:
              - *harness
              - 'examples/converters/playwright/**'

  lint:
    name: lint
    needs: [changes]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # the only job that saves the cache (fastest job, never on the critical path)
          save-cache: 'true'
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - run: pnpm lint

  test-integration-coverage:
    name: test-integration-coverage
    needs: [changes]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - run: pnpm build
      - name: Test integration (with coverage)
        run: pnpm test:integration:ci

  # Converter end-to-end checks: the example runs the real tool in a browser, the
  # converter turns its output into a manifest, the harness checks it against the
  # files on disk (see examples/converters/README.md). Skipped jobs count as passing.
  e2e-jest-image-snapshot:
    name: e2e-jest-image-snapshot
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-jest-image-snapshot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-jest-image-snapshot...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/playwright-browsers
        with:
          package: '@visual-regression/e2e-jest-image-snapshot'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/jest-image-snapshot.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-jest-image-snapshot
          path: |
            examples/converters/jest-image-snapshot/tests/__image_snapshots__
            examples/converters/jest-image-snapshot/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  e2e-playwright:
    name: e2e-playwright
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-playwright == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-playwright...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/playwright-browsers
        with:
          package: '@visual-regression/e2e-playwright'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/playwright.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-playwright
          path: |
            examples/converters/playwright/test-results
            examples/converters/playwright/tests/box.spec.mjs-snapshots
            examples/converters/playwright/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  prepare-release:
    name: detect changes, bump package versions, generate changelog and commit it to main branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-integration-coverage]
    if: ${{ github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          command: manifest
          default-branch: main
          monorepo-tags: true

  release:
    name: release (stable when release-please cut one, otherwise a canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release]
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - name: Build packages to get cross-references working 🔧
        run: pnpm build
      - name: Release packages under latest
        if: ${{ needs.prepare-release.outputs.releases_created == 'true' }}
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish a canary of this commit under the canary dist-tag
        if: ${{ needs.prepare-release.outputs.releases_created != 'true' }}
        run: node scripts/publish.mjs --canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
