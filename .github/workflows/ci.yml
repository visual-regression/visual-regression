name: CI
# Always triggered, because the required status checks (lint, test-integration-coverage) must
# report on every PR: a workflow skipped by `paths-ignore` leaves them pending and blocks the merge.
# The `changes` job decides instead, and a job skipped by `if` counts as passing.
# The site has its own workflow (site.yml) with the opposite path filter.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  # The package jobs never need the site or its Nuxt toolchain, nor the converter
  # examples and the tools they pin (billed minutes, browser downloads).
  PACKAGES_INSTALL_FILTER: --filter '!./apps/**' --filter '!./examples/**'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      e2e-jest-image-snapshot: ${{ steps.e2e.outputs.jest-image-snapshot }}
      e2e-playwright: ${{ steps.e2e.outputs.playwright }}
      e2e-vitest-browser: ${{ steps.e2e.outputs.vitest-browser }}
      e2e-cypress: ${{ steps.e2e.outputs.cypress }}
      e2e-backstopjs: ${{ steps.e2e.outputs.backstopjs }}
      e2e-roborazzi: ${{ steps.e2e.outputs.roborazzi }}
    steps:
      # On push the filter diffs commits locally; on pull_request it uses the API.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            packages:
              - '**'
              - '!apps/**'
              - '!.github/workflows/site.yml'
      # One output per converter example (examples/converters/<tool>): its job runs the
      # real tool, so only changes to the sources of the two packages it exercises
      # (the manifest package converts, the viewer renders), its example, the harness
      # or this workflow trigger it. The lockfile is left out on purpose: a
      # lockfile-only bump would run every tool.
      - uses: dorny/paths-filter@v3
        id: e2e
        with:
          filters: |
            harness: &harness
              - 'examples/converters/harness/**'
              - 'packages/visual-regression-manifest/src/**'
              - '!packages/visual-regression-manifest/src/**/*.test.ts'
              - 'packages/visual-regression-viewer/src/**'
              - '!packages/visual-regression-viewer/src/**/*.test.ts'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            jest-image-snapshot:
              - *harness
              - 'examples/converters/jest-image-snapshot/**'
            playwright:
              - *harness
              - 'examples/converters/playwright/**'
            vitest-browser:
              - *harness
              - 'examples/converters/vitest-browser/**'
            cypress:
              - *harness
              - 'examples/converters/cypress/**'
            backstopjs:
              - *harness
              - 'examples/converters/backstopjs/**'
            roborazzi:
              - *harness
              - 'examples/converters/roborazzi/**'

  lint:
    name: lint
    needs: [changes]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # the only job that saves the cache (fastest job, never on the critical path)
          save-cache: 'true'
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - run: pnpm lint

  test-integration-coverage:
    name: test-integration-coverage
    needs: [changes]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - run: pnpm build
      - name: Test integration (with coverage)
        run: pnpm test:integration:ci

  # Converter end-to-end checks: the example runs the real tool in a browser, the
  # converter turns its output into a manifest, the harness checks it against the
  # files on disk (see examples/converters/README.md). Skipped jobs count as passing.
  e2e-jest-image-snapshot:
    name: e2e-jest-image-snapshot
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-jest-image-snapshot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-jest-image-snapshot...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/playwright-browsers
        with:
          package: '@visual-regression/e2e-jest-image-snapshot'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/jest-image-snapshot.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-jest-image-snapshot
          path: |
            examples/converters/jest-image-snapshot/tests/__image_snapshots__
            examples/converters/jest-image-snapshot/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  e2e-playwright:
    name: e2e-playwright
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-playwright == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-playwright...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/playwright-browsers
        with:
          package: '@visual-regression/e2e-playwright'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/playwright.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-playwright
          path: |
            examples/converters/playwright/test-results
            examples/converters/playwright/tests/box.spec.mjs-snapshots
            examples/converters/playwright/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  e2e-vitest-browser:
    name: e2e-vitest-browser
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-vitest-browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-vitest-browser...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/playwright-browsers
        with:
          package: '@visual-regression/e2e-vitest-browser'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/vitest-browser.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-vitest-browser
          path: |
            examples/converters/vitest-browser/tests/__screenshots__
            examples/converters/vitest-browser/.vitest
            examples/converters/vitest-browser/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  e2e-cypress:
    name: e2e-cypress
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-cypress == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-cypress...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - id: cypress-version
        run: echo "version=$(pnpm --filter @visual-regression/e2e-cypress exec cypress --version --component package)" >> "$GITHUB_OUTPUT"
      - name: Cache the Cypress binary 🌲 (keyed by the exact Cypress version, no fallback)
        id: cypress-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.version }}
      - if: ${{ steps.cypress-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @visual-regression/e2e-cypress exec cypress install
      - run: pnpm --filter @visual-regression/e2e-cypress exec cypress verify
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/cypress.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-cypress
          path: |
            examples/converters/cypress/cypress/snapshots
            examples/converters/cypress/cypress/image-snapshot
            examples/converters/cypress/cypress/e2e/pixsame/__image_snapshots__
            examples/converters/cypress/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  e2e-backstopjs:
    name: e2e-backstopjs
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-backstopjs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-backstopjs...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - uses: ./.github/actions/puppeteer-browser
        with:
          package: '@visual-regression/e2e-backstopjs'
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/backstopjs.test.ts
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-backstopjs
          path: |
            examples/converters/backstopjs/backstop_data
            examples/converters/backstopjs/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  # The only example that is not a JavaScript tool: a Gradle module with a Robolectric
  # test. Gradle itself and the dependencies come from setup-gradle's caches (keyed by
  # the build files), Robolectric's android-all jars from a cache keyed by its version.
  e2e-roborazzi:
    name: e2e-roborazzi
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e-roborazzi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: --filter @visual-regression/e2e-harness... --filter @visual-regression/e2e-roborazzi...
      - run: pnpm --filter visual-regression-manifest --filter visual-regression-viewer build
      - id: versions
        run: |
          toml=examples/converters/roborazzi/gradle/libs.versions.toml
          # only the [versions] entries have a quoted value on the line; [libraries] repeat the names
          echo "gradle=$(grep -m1 -E '^gradle = "' "$toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "robolectric=$(grep -m1 -E '^robolectric = "' "$toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}
          cache-read-only: false
      - name: Cache Robolectric's android-all jars 🤖 (keyed by the Robolectric version, no fallback)
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ steps.versions.outputs.robolectric }}
      - run: pnpm --filter @visual-regression/e2e-harness typecheck
      - run: pnpm --filter @visual-regression/e2e-harness e2e tests/roborazzi.test.ts
        env:
          GRADLE_BIN: gradle
          E2E_CAPTURE: '1'
      # the fixture of fromRoborazziResults' unit test is captured here, not on a laptop
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: roborazzi-fixtures
          path: packages/visual-regression-manifest/__tests__/fixtures/roborazzi
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: e2e-roborazzi
          path: |
            examples/converters/roborazzi/lib/build/outputs/roborazzi
            examples/converters/roborazzi/lib/build/test-results
            examples/converters/roborazzi/lib/build/reports
            examples/converters/roborazzi/visual-regression-manifest.*.json
            examples/converters/harness/test-results

  prepare-release:
    name: detect changes, bump package versions, generate changelog and commit it to main branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-integration-coverage]
    if: ${{ github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          command: manifest
          default-branch: main
          monorepo-tags: true

  release:
    name: release (stable when release-please cut one, otherwise a canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release]
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-filter: ${{ env.PACKAGES_INSTALL_FILTER }}
      - name: Build packages to get cross-references working 🔧
        run: pnpm build
      - name: Release packages under latest
        if: ${{ needs.prepare-release.outputs.releases_created == 'true' }}
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish a canary of this commit under the canary dist-tag
        if: ${{ needs.prepare-release.outputs.releases_created != 'true' }}
        run: node scripts/publish.mjs --canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
