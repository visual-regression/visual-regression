name: Playwright browsers
description: Restore the Chromium headless shell for the Playwright version a workspace package pins; download it only when that version changed.

inputs:
  package:
    description: The workspace package whose Playwright version decides the cache key (it must depend on `playwright`, `@playwright/test` or, with `cli` set, `playwright-core`).
    required: true
  cli:
    description: The Playwright CLI that package exposes; `playwright-core` for a tool that depends on playwright-core alone.
    required: false
    default: playwright

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "playwright=$(pnpm --filter ${{ inputs.package }} exec ${{ inputs.cli }} --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers 🎭 (keyed by the exact Playwright version, no fallback)
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}
    # On a hit nothing is installed, not even the OS packages: a runner image that
    # drops a library fails the job loudly and the key gets bumped by hand.
    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm --filter ${{ inputs.package }} exec ${{ inputs.cli }} install chromium --only-shell --with-deps
