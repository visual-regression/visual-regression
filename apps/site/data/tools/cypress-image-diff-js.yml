name: cypress-image-diff-js
website: https://github.com/uktrade/cypress-image-diff
summary: Cypress plugin that keeps baseline, comparison and diff folders and writes a JSON plus HTML report per run.
category: runner-integration
openSource: true
license: MIT
selfHostable: true
hosting: local
runners:
  - Cypress
diffEngine: pixelmatch, failureThreshold as a ratio
reviewSurface:
  - local
baselineStorage: repo
pricingModel: free
machineReadableResults: json-report
manifestSupport: converter
notes:
  - The JSON report lists suites and tests with baselinePath, comparisonPath, diffPath, percentage and failureThreshold; fromCypressImageDiff in visual-regression-manifest converts it.
  - The reported percentage is the square root of the share of differing pixels, and the threshold is on the same scale.
lastVerified: '2026-11-05'
sources:
  - https://github.com/uktrade/cypress-image-diff
