name: pixelmatch
website: https://github.com/mapbox/pixelmatch
summary: Small pixel-level image comparison library with anti-aliasing detection; the engine behind Playwright, Vitest, jest-image-snapshot and many plugins.
category: diff-engine
openSource: true
license: ISC
selfHostable: true
hosting: local
runners:
  - any (library)
diffEngine: per-pixel YIQ color distance with a threshold, anti-aliased pixels ignored by default
reviewSurface:
  - local
baselineStorage: repo
pricingModel: free
machineReadableResults: none
manifestSupport: none
notes:
  - Returns the number of differing pixels and writes a diff image; everything else is up to the caller.
lastVerified: '2026-10-13'
sources:
  - https://github.com/mapbox/pixelmatch
