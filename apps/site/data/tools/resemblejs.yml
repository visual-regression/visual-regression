name: Resemble.js
website: https://github.com/rsmbl/Resemble.js
summary: Image analysis and comparison library that reports a mismatch percentage and renders highlighted diffs; the engine behind BackstopJS.
category: diff-engine
openSource: true
license: MIT
selfHostable: true
hosting: local
runners:
  - any (library, browser or Node)
diffEngine: per-pixel color tolerance with ignore modes (antialiasing, colors, alpha, nothing)
reviewSurface:
  - local
baselineStorage: repo
pricingModel: free
machineReadableResults: none
manifestSupport: none
notes:
  - Reports misMatchPercentage as a string with two decimals, dimension differences and analysis time.
lastVerified: '2026-10-13'
sources:
  - https://github.com/rsmbl/Resemble.js
