name: Loki
website: https://github.com/oblador/loki
summary: Visual regression for Storybook stories, rendered in Chrome (local, Docker or AWS Lambda) or iOS and Android simulators.
category: runner-integration
openSource: true
license: MIT
selfHostable: true
hosting: local
runners:
  - Storybook
diffEngine: pixelmatch or looks-same, configurable per target
reviewSurface:
  - local
baselineStorage: repo
pricingModel: free
machineReadableResults: images-only
manifestSupport: converter
notes:
  - Writes .loki/reference, .loki/current and .loki/difference folders; no machine-readable summary was found. fromLoki in visual-regression-manifest reads the folders (not checked against a real run).
lastVerified: '2026-11-05'
sources:
  - https://github.com/oblador/loki
