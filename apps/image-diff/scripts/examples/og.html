<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #fafafa;
        color: #18181b;
        display: flex;
        align-items: center;
        padding: 0 80px;
        gap: 56px;
      }
      .mark {
        flex: none;
        width: 200px;
        height: 200px;
      }
      h1 {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin-bottom: 18px;
      }
      p {
        font-size: 28px;
        color: #52525b;
        line-height: 1.35;
        max-width: 760px;
      }
      .site {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font-size: 24px;
        color: #71717a;
      }
      .site b {
        color: #18181b;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 64 64">
      <rect x="6" y="6" width="36" height="36" rx="9" fill="#a1a1aa" />
      <rect x="22" y="22" width="36" height="36" rx="9" fill="#18181b" />
      <path d="M22 22h20v11a9 9 0 0 1-9 9H22z" fill="#10b981" />
    </svg>
    <div>
      <h1>Online image diff</h1>
      <p>
        pixelmatch, Resemble.js, SSIM, exact pixels and a perceptual hash, side
        by side. Runs in your browser, nothing is uploaded.
      </p>
    </div>
    <div class="site">
      <b>diff.visual-regression.dev</b> · a tool from visual-regression.dev
    </div>
  </body>
</html>
